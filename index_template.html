<script>
$all('.navitem').forEach(b => b.addEventListener('click', ()=> goScreen(b.dataset.screen)));

function showIntro(){
  const backdrop = el(`<div class="intro-backdrop" id="introBackdrop">
    <div class="intro-card">
      <div class="logo-mark">🧭</div>
      <h2>Welcome to AI Yatri</h2>

      <button class="cta-btn" id="introStart">Start planning</button>
    </div>
  </div>`);
  document.body.appendChild(backdrop);
  $('#introStart', backdrop).addEventListener('click', ()=>{ backdrop.remove(); goScreen('chat'); });
}
