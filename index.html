<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>AI Yatri — Plan India, Personally</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap');

:root{
  --teal-900:#0B3D39; --teal-700:#14615A; --teal-500:#1D8377; --teal-100:#DCEbE7;
  --terracotta:#C1592B; --terracotta-dark:#93401D;
  --marigold:#E8A33D; --marigold-light:#F4C765;
  --sand:#F1E6D3; --sand-dark:#E2D0AC; --cream:#FBF5E9;
  --ink:#221B14; --ink-soft:#5B5142;
  --safer:#1D8377; --caution:#E8A33D;
  --radius:16px;
  font-size:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--teal-900);}
body{
  font-family:'Manrope',sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased;
  display:flex; justify-content:center;
}
h1,h2,h3,h4{ font-family:'Fraunces',serif; font-weight:600; margin:0 0 4px; color:var(--teal-900); letter-spacing:-0.01em;}
p{margin:0 0 8px; line-height:1.5;}
.muted{color:var(--ink-soft); font-size:0.85em;}
button{font-family:inherit; cursor:pointer;}
ul{margin:0; padding-left:18px;}
li{margin-bottom:6px; line-height:1.4;}

#app{
  width:100%; max-width:1180px; min-height:100vh; background:var(--sand);
  display:flex; flex-direction:column; position:relative;
  box-shadow:0 0 60px rgba(0,0,0,0.35);
  background-image: radial-gradient(circle at 1px 1px, rgba(34,27,20,0.05) 1px, transparent 0);
  background-size: 14px 14px;
}

/* ---------- TOP BAR ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--teal-900); color:var(--cream);
  padding:14px 18px 12px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:3px dashed var(--marigold);
}
.topbar .logo{ display:flex; align-items:center; gap:8px; }
.topbar .logo-mark{
  width:30px; height:30px; border-radius:50%; background:var(--terracotta);
  display:flex; align-items:center; justify-content:center; font-size:16px; border:2px solid var(--marigold-light);
}
#app-title{ font-family:'Fraunces',serif; font-size:1.15rem; font-weight:600; letter-spacing:-0.01em; }
.topbar-sub{ font-family:'Space Mono',monospace; font-size:0.62rem; opacity:0.75; letter-spacing:0.04em; text-transform:uppercase;}
.auth-btn{ background:transparent; color:var(--cream); border:1px solid var(--marigold-light); border-radius:999px; padding:7px 11px; font-size:0.72rem; font-weight:700; }

/* ---------- MAIN SCROLL ---------- */
#main-scroll{ flex:1; overflow-y:auto; padding:18px 16px 100px; }

/* ---------- BOTTOM NAV ---------- */
.bottomnav{
  position:sticky; bottom:0; z-index:20; display:flex;
  background:var(--cream); border-top:1px solid var(--sand-dark);
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
}
.navitem{
  flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:6px 2px; border-radius:12px; color:var(--ink-soft); font-size:0.68rem; font-weight:600;
}
.navitem .navicon{ font-size:1.2rem; }
.navitem.active{ color:var(--terracotta-dark); }
.navitem.active .navicon{ transform:translateY(-2px); }

/* ---------- HERO ---------- */
.hero{ position:relative; border-radius:var(--radius); overflow:hidden; margin-bottom:22px; border:2px solid var(--teal-900);}
.hero-img{ width:100%; display:block; height:190px; object-fit:cover; filter:saturate(1.05);}
.hero-copy{ background:var(--teal-900); color:var(--cream); padding:18px 18px 20px; }
.eyebrow{ font-family:'Space Mono',monospace; font-size:0.65rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--marigold-light); display:block; margin-bottom:6px;}
.hero-copy h1{ color:#fff; font-size:1.7rem; line-height:1.1; margin-bottom:8px;}
.hero-copy p{ color:#E7DFCF; font-size:0.88rem; margin:0;}
.section-hero{ width:100%; height:130px; object-fit:cover; border-radius:var(--radius); margin-bottom:16px; border:2px solid var(--teal-900);}

/* ---------- BLOCKS ---------- */
.block{ margin-bottom:26px; }
.block-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; gap:8px;}
.block-head h2{ font-size:1.2rem; }
.hint{ font-size:0.72rem; color:var(--ink-soft); font-family:'Space Mono',monospace;}

/* ---------- DESTINATION CARDS ---------- */
.dest-grid{ display:flex; flex-direction:column; gap:10px; }
.dest-card{
  text-align:left; background:var(--cream); border:2px solid var(--sand-dark); border-radius:var(--radius);
  padding:14px 16px; position:relative; transition:transform .15s, border-color .15s;
}
.dest-card:active{ transform:scale(0.98); }
.dest-card.selected{ border-color:var(--terracotta); background:#FDEFE4; }
.dest-card h3{ font-size:1.15rem; margin-bottom:2px;}
.dest-card p{ font-size:0.82rem; color:var(--ink-soft); margin:0;}
.dest-stamp{
  position:absolute; top:12px; right:14px; font-family:'Space Mono',monospace; font-size:0.6rem;
  border:1.5px solid var(--terracotta); color:var(--terracotta-dark); border-radius:20px; padding:2px 9px;
  transform:rotate(4deg); text-transform:uppercase; letter-spacing:0.05em;
}
.destination-search{ display:flex; gap:8px; margin-bottom:12px; }
.destination-search input{ flex:1; min-width:0; padding:11px 14px; border:1.5px solid var(--sand-dark); border-radius:24px; font:inherit; background:var(--cream); }
.destination-search .icon-btn{ flex:0 0 auto; }
.search-create{ border-style:dashed; }

/* ---------- FORM ---------- */
.trip-setup{ background:var(--cream); border-radius:var(--radius); padding:16px; border:2px solid var(--sand-dark);}
.field{ margin-bottom:12px; flex:1; }
.field-row{ display:flex; gap:10px; }
.field label{ display:block; font-size:0.72rem; font-weight:700; color:var(--teal-700); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.03em;}
.field input, .field select{
  width:100%; padding:10px 12px; border:1.5px solid var(--sand-dark); border-radius:10px; font-size:0.95rem;
  font-family:'Manrope',sans-serif; background:#fff; color:var(--ink);
}
.cta-btn{
  width:100%; background:var(--terracotta); color:#fff; border:none; border-radius:12px; padding:14px;
  font-weight:700; font-size:0.95rem; margin-top:6px; box-shadow:0 3px 0 var(--terracotta-dark);
}
.cta-btn:active{ transform:translateY(2px); box-shadow:none;}
.ghost-btn{ background:transparent; border:1.5px solid var(--teal-700); color:var(--teal-700); border-radius:10px; padding:9px 14px; font-weight:700; font-size:0.85rem;}
.ghost-btn.small{ padding:6px 12px; font-size:0.75rem;}
.microhint{ font-size:0.75rem; color:var(--ink-soft); margin-top:8px; text-align:center;}

/* ---------- EMPTY STATE ---------- */
.empty-state{ text-align:center; padding:50px 20px; background:var(--cream); border-radius:var(--radius); border:2px dashed var(--sand-dark);}
.empty-state p{ color:var(--ink-soft); margin-bottom:16px;}

/* ---------- TRIP HEADER / TABS ---------- */
.trip-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}
.trip-header h1{ font-size:1.6rem; }
.tabbar{ display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:14px; scrollbar-width:none;}
.tabbar::-webkit-scrollbar{ display:none; }
.tabbtn{
  flex:0 0 auto; background:var(--cream); border:1.5px solid var(--sand-dark); color:var(--ink-soft);
  padding:8px 14px; border-radius:20px; font-size:0.78rem; font-weight:700; white-space:nowrap;
}
.tabbtn.active{ background:var(--teal-700); color:#fff; border-color:var(--teal-700); }

/* ---------- ITINERARY / POSTCARDS ---------- */
.route-from{ font-family:'Space Mono',monospace; font-size:0.72rem; background:var(--teal-100); color:var(--teal-900); padding:8px 12px; border-radius:10px; margin-bottom:10px;}
.mode-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.badge{ font-size:0.68rem; font-weight:700; padding:5px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:0.03em;}
.badge-ai{ background:var(--teal-700); color:#fff; }
.badge-demo{ background:var(--sand-dark); color:var(--ink-soft); }
.day-block{ margin-bottom:22px; }
.day-title-row h3{ font-size:1.05rem; margin-bottom:12px; }
.route-track{ position:relative; padding-left:18px; border-left:3px dotted var(--terracotta); display:flex; flex-direction:column; gap:14px;}
.postcard{ position:relative; }
.route-dot{ position:absolute; left:-25px; top:14px; width:10px; height:10px; border-radius:50%; background:var(--terracotta); border:2px solid var(--cream);}
.postcard-body{
  background:var(--cream); border:2px solid var(--sand-dark); border-radius:14px; padding:13px 14px;
  box-shadow:3px 3px 0 var(--sand-dark);
}
.postcard-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:4px;}
.postcard-top h4{ font-size:1rem; }
.pc-desc{ font-size:0.85rem; color:var(--ink-soft); margin-bottom:8px;}
.pc-meta{ font-size:0.8rem; border-top:1px dashed var(--sand-dark); padding-top:8px; margin-bottom:6px;}
.pc-reason{ color:var(--ink-soft); font-style:italic; margin-top:2px;}
.pc-footer{ font-family:'Space Mono',monospace; font-size:0.75rem; color:var(--terracotta-dark); font-weight:700;}
.visit-media{ display:grid; grid-template-columns:1fr 1fr; gap:7px; margin:8px 0 10px; }
.visit-media figure{ margin:0; }
.visit-media img{ width:100%; height:82px; object-fit:cover; border-radius:9px; border:1px solid var(--sand-dark); display:block; }
.visit-media figcaption{ font-size:0.63rem; color:var(--ink-soft); margin-top:3px; }
.reach-box{ display:flex; flex-direction:column; gap:5px; margin-top:9px; padding-top:9px; border-top:1px dashed var(--sand-dark); font-size:0.74rem; color:var(--ink-soft); }
.reach-box strong{ color:var(--teal-900); }
.reach-box a{ color:var(--terracotta-dark); font-weight:700; text-decoration:none; }
.chip-tag{ background:var(--teal-100); color:var(--teal-900); font-size:0.68rem; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap;}
.chip-tag.chip-alt{ background:var(--marigold-light); color:var(--terracotta-dark); }
.loading-block{ text-align:center; padding:40px 10px; }
.spinner{ width:32px; height:32px; border:4px solid var(--sand-dark); border-top-color:var(--terracotta); border-radius:50%; margin:0 auto 14px; animation:spin 0.9s linear infinite;}
@keyframes spin{ to{ transform:rotate(360deg);} }

/* ---------- TRANSPORT TICKETS ---------- */
.demo-banner{ background:#FDEFE4; border:1.5px dashed var(--terracotta); color:var(--terracotta-dark); font-size:0.76rem; padding:9px 12px; border-radius:10px; margin-bottom:14px;}
.transport-group{ margin-bottom:18px; }
.transport-group h3{ font-size:0.95rem; margin-bottom:8px;}
.ticket-list{ display:flex; flex-direction:column; gap:9px; }
.ticket{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  background:var(--cream); border:1.5px solid var(--sand-dark); border-radius:12px; padding:11px 12px;
  position:relative; overflow:hidden;
}
.ticket::before, .ticket::after{ content:''; position:absolute; width:14px; height:14px; background:var(--sand); border-radius:50%; top:50%; transform:translateY(-50%);}
.ticket::before{ left:-7px; } .ticket::after{ right:-7px; }
.ticket-selected{ border-color:var(--terracotta); background:#FDEFE4; }
.ticket-op{ font-weight:700; font-size:0.88rem; }
.ticket-route{ font-size:0.78rem; color:var(--ink-soft); }
.ticket-sub{ font-family:'Space Mono',monospace; font-size:0.68rem; color:var(--teal-700); margin-top:2px;}
.ticket-price{ font-family:'Space Mono',monospace; font-weight:700; text-align:right; color:var(--terracotta-dark); font-size:0.95rem;}
.ticket-price span{ display:block; font-size:0.6rem; font-weight:400; color:var(--ink-soft);}

/* ---------- STAY ---------- */
.budget-strip{ display:flex; justify-content:space-between; background:var(--teal-900); color:#fff; border-radius:12px; padding:12px 14px; margin-bottom:14px; gap:6px;}
.budget-strip div{ display:flex; flex-direction:column; font-size:0.7rem; text-align:center; flex:1;}
.budget-strip strong{ font-family:'Space Mono',monospace; font-size:0.85rem; margin-top:3px;}
.stay-list{ display:flex; flex-direction:column; gap:10px; }
.stay-card{ display:flex; justify-content:space-between; gap:10px; background:var(--cream); border:1.5px solid var(--sand-dark); border-radius:12px; padding:12px 14px;}
.stay-selected{ border-color:var(--terracotta); background:#FDEFE4;}
.stay-over{ opacity:0.6; }
.stay-main h4{ font-size:0.95rem; margin-bottom:4px;}
.stay-sub{ font-size:0.75rem; color:var(--ink-soft); margin-top:4px;}
.stay-price{ font-family:'Space Mono',monospace; font-weight:700; color:var(--terracotta-dark); text-align:right; white-space:nowrap;}
.stay-price span{ display:block; font-size:0.6rem; font-weight:400; color:var(--ink-soft);}
.over-flag{ font-size:0.6rem; color:var(--terracotta); font-weight:700; margin-top:3px;}

/* ---------- MOBILITY / DISCOVER ---------- */
.mobility-grid, .discover-grid{ display:flex; flex-direction:column; gap:12px; }
.mobility-card, .discover-card{ background:var(--cream); border:1.5px solid var(--sand-dark); border-radius:14px; padding:14px;}
.mobility-card h3, .discover-card h3{ font-size:0.95rem; margin-bottom:8px;}
.mobility-card.highlight{ background:#FDEFE4; border-color:var(--terracotta); }
.mob-row{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:0.82rem; padding:6px 0; border-bottom:1px dashed var(--sand-dark);}
.mob-row:last-child{ border-bottom:none; }
.discover-card li{ font-size:0.85rem; }

/* ---------- MAP / SAFETY ---------- */
.safety-map{ margin-bottom:14px; }
.mini-map{ width:100%; border-radius:14px; border:2px solid var(--teal-900); }
.google-map-block{ background:var(--cream); padding:14px; border:1.5px solid var(--sand-dark); border-radius:14px; }
.google-map{ width:100%; height:260px; border:0; border-radius:10px; display:block; margin-bottom:8px; }
.zone-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px;}
.zone-row{ display:flex; gap:10px; align-items:flex-start; background:var(--cream); border-radius:12px; padding:10px 12px; border:1px solid var(--sand-dark);}
.zone-row p{ font-size:0.78rem; color:var(--ink-soft); margin:0;}
.zone-dot{ width:12px; height:12px; border-radius:50%; margin-top:4px; flex:0 0 auto;}
.helpline-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.helpline-chip{ background:var(--teal-900); color:#fff; border-radius:10px; padding:9px 10px; display:flex; flex-direction:column; gap:2px;}
.helpline-chip span{ font-size:0.65rem; opacity:0.8;}
.helpline-chip strong{ font-family:'Space Mono',monospace; font-size:1rem; color:var(--marigold-light);}

.offline-progress .bar{ height:10px; background:var(--sand-dark); border-radius:6px; overflow:hidden; margin-bottom:8px;}
.offline-progress .bar-fill{ height:100%; background:var(--terracotta); transition:width .25s; }
.offline-ready{ background:var(--cream); border:1.5px solid var(--sand-dark); border-radius:14px; padding:14px;}
.offline-status{ display:flex; align-items:center; gap:8px; font-weight:700; margin-bottom:10px;}
.dot-ok{ width:10px; height:10px; border-radius:50%; background:var(--safer); }
.offline-pois{ list-style:none; padding:0; margin:0 0 12px; display:flex; flex-direction:column; gap:6px; font-size:0.85rem;}
.offline-sim{ margin-top:12px; }
.offline-sim-map{ margin-bottom:8px; }

/* ---------- CHAT ---------- */
.persona-mini{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.chat-scroll{ display:flex; flex-direction:column; gap:12px; margin-bottom:14px; min-height:200px;}
.bubble{ display:flex; gap:8px; align-items:flex-start; max-width:92%; }
.bubble-ai{ align-self:flex-start; }
.bubble-user{ align-self:flex-end; }
.bubble-avatar{ font-size:1.3rem; flex:0 0 auto;}
.bubble-text{ background:var(--cream); border:1.5px solid var(--sand-dark); border-radius:14px 14px 14px 4px; padding:10px 13px; font-size:0.87rem; line-height:1.45;}
.bubble-user .bubble-text{ background:var(--teal-700); color:#fff; border-radius:14px 14px 4px 14px; border:none;}
.chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.chip-opt{ background:#fff; border:1.5px solid var(--teal-500); color:var(--teal-700); border-radius:20px; padding:7px 12px; font-size:0.8rem; font-weight:600;}
.chip-opt.chip-selected{ background:var(--teal-700); color:#fff; }
.chip-confirm{ background:var(--terracotta); color:#fff; border-color:var(--terracotta);}
.chat-input-row{ position:sticky; bottom:0; display:flex; gap:8px; background:var(--sand); padding-top:6px;}
#chatInput{ flex:1; padding:12px 14px; border-radius:24px; border:1.5px solid var(--sand-dark); font-size:0.9rem; font-family:'Manrope',sans-serif;}
.icon-btn{ width:42px; height:42px; border-radius:50%; border:none; background:var(--cream); border:1.5px solid var(--sand-dark); font-size:1rem;}
.icon-btn.send{ background:var(--terracotta); color:#fff; border:none;}

/* ---------- PROFILE ---------- */
.profile-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
.profile-actions{ display:flex; gap:6px; align-items:center; }
.profile-facts{ display:grid; grid-template-columns:1fr 1fr; gap:10px; background:var(--cream); border:1.5px solid var(--sand-dark); border-radius:12px; padding:12px;}
.profile-facts div{ display:flex; flex-direction:column; font-size:0.72rem; color:var(--ink-soft);}
.profile-facts strong{ font-size:0.85rem; color:var(--ink); margin-top:2px; text-transform:capitalize;}
.account-stub{ display:flex; flex-direction:column; gap:10px; background:var(--cream); border:1.5px solid var(--sand-dark); border-radius:12px; padding:14px;}
.account-row{ display:flex; align-items:center; gap:10px; font-size:0.85rem;}
.account-row > div{ min-width:0; display:flex; flex-direction:column; gap:2px; }
.account-row strong{ overflow-wrap:anywhere; }
.account-row small{ color:var(--ink-soft); font-size:0.7rem; }
.account-row em{ color:var(--ink-soft); font-style:normal; font-size:0.72rem; margin-left:auto;}
.account-row select{ margin-left:6px; padding:4px 6px; border-radius:6px; border:1px solid var(--sand-dark);}
.footnote{ font-size:0.7rem; color:var(--ink-soft); text-align:center; margin-top:10px; line-height:1.5; padding:0 6px 10px;}

/* ---------- TOAST ---------- */
.toast{
  position:fixed; left:50%; bottom:90px; transform:translate(-50%,20px); background:var(--teal-900); color:#fff;
  padding:11px 18px; border-radius:30px; font-size:0.82rem; opacity:0; transition:all .25s; pointer-events:none; z-index:99; max-width:85%; text-align:center;
}
.toast.show{ opacity:1; transform:translate(-50%,0); }

/* ---------- AUTH ---------- */
.auth-backdrop{ position:fixed; inset:0; z-index:120; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(11,61,57,0.84); }
.auth-card{ width:min(100%,380px); position:relative; background:var(--cream); border:3px solid var(--marigold); border-radius:18px; padding:24px 20px 20px; box-shadow:0 18px 50px rgba(0,0,0,.28); }
.auth-card h2{ font-size:1.5rem; margin-bottom:6px; }
.auth-close{ position:absolute; top:10px; right:12px; border:0; background:transparent; color:var(--ink-soft); font-size:1.5rem; line-height:1; }
.auth-label{ display:block; margin-top:14px; color:var(--teal-700); font-size:0.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.04em; }
.auth-label input{ width:100%; margin-top:5px; padding:11px 12px; border:1.5px solid var(--sand-dark); border-radius:10px; background:#fff; font:inherit; color:var(--ink); }
.auth-note{ text-align:center; color:var(--ink-soft); font-size:0.7rem; margin:10px 0 0; }
.auth-error{ min-height:18px; margin-top:10px; color:var(--terracotta-dark); font-size:0.78rem; font-weight:700; }
.auth-switch{ width:100%; margin-top:12px; border:0; background:none; color:var(--teal-700); font:inherit; font-size:0.8rem; font-weight:800; text-decoration:underline; }

/* ---------- INTRO MODAL ---------- */
.intro-backdrop{ position:fixed; inset:0; background:rgba(11,61,57,0.82); display:flex; align-items:center; justify-content:center; z-index:100; padding:24px;}
.intro-card{ background:var(--cream); border-radius:20px; padding:26px 22px; max-width:400px; border:3px solid var(--marigold); text-align:center;}
.intro-card .logo-mark{ width:52px; height:52px; font-size:26px; margin:0 auto 12px;}
.intro-card h2{ font-size:1.3rem; margin-bottom:8px;}
.intro-card p{ font-size:0.85rem; color:var(--ink-soft); margin-bottom:18px;}

@media (min-width:481px){
  body{ background:linear-gradient(160deg, var(--teal-900), #062522); }
}

@media (min-width:760px){
  #main-scroll{ padding:28px 32px 120px; }
  .hero{ display:grid; grid-template-columns:1.1fr 1fr; }
  .hero-img{ height:100%; min-height:280px; }
  .hero-copy{ display:flex; flex-direction:column; justify-content:center; padding:30px; }
  .hero-copy h1{ font-size:2.3rem; }
  .dest-grid{ display:grid; grid-template-columns:repeat(3,1fr); }
  .trip-setup{ max-width:760px; }
  .mobility-grid, .discover-grid{ display:grid; grid-template-columns:repeat(2,1fr); }
  .day-block{ max-width:900px; }
  .route-track{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); border-left:0; padding-left:0; }
  .route-dot{ display:none; }
  .postcard{ min-width:0; }
  .bottomnav{ max-width:680px; margin:0 auto; width:100%; }
}

@media (min-width:1100px){
  #main-scroll{ padding-left:64px; padding-right:64px; }
  .hero-copy h1{ font-size:2.8rem; }
  .route-track{ grid-template-columns:repeat(3,minmax(0,1fr)); }
}

@media (max-width:420px){
  #main-scroll{ padding-left:12px; padding-right:12px; }
  .topbar{ padding-left:12px; padding-right:12px; }
  .field-row{ gap:7px; }
  .field input, .field select{ padding-left:9px; padding-right:9px; }
  .profile-actions{ flex-wrap:wrap; justify-content:flex-end; }
  .postcard-body{ padding:11px; }
}

</style>
</head>

/* Mock transport generator \u2014 deterministic "random" from strings so it's stable per session */
function seedRand(seed){ let h=0; for(let i=0;i<seed.length;i++){h=Math.imul(31,h)+seed.charCodeAt(i)|0;} return function(){ h = Math.imul(48271, h) | 0 % 2147483647; return ((h>>>0)/4294967295); }; }

function mockTransport(fromCity, destKey){
  const rnd = seedRand(fromCity+destKey);
  const far = !['guwahati'].includes(destKey) ; // shillong/kaziranga need connecting leg
  const base = 2200 + Math.floor(rnd()*2600);
  const flights = fromCity==='Guwahati' ? [] : [
    {id:'fl1', mode:'flight', operator:'IndiGo', bookingUrl:'https://www.goindigo.in/', from:fromCity, to:'Guwahati (GAU)'+(destKey!=='guwahati'?' + road transfer':''), duration: (2+Math.round(rnd()*2))+'h '+Math.floor(rnd()*59)+'m', price: base + Math.floor(rnd()*1500), stops:'Non-stop'},
    {id:'fl2', mode:'flight', operator:'Air India', bookingUrl:'https://www.airindia.com/', from:fromCity, to:'Guwahati (GAU)'+(destKey!=='guwahati'?' + road transfer':''), duration: (3+Math.round(rnd()*2))+'h '+Math.floor(rnd()*59)+'m', price: base + 800 + Math.floor(rnd()*1200), stops: rnd()>0.5?'Non-stop':'1 stop'},
    {id:'fl3', mode:'flight', operator:'SpiceJet', bookingUrl:'https://www.spicejet.com/', from:fromCity, to:'Guwahati (GAU)'+(destKey!=='guwahati'?' + road transfer':''), duration: (2+Math.round(rnd()*3))+'h '+Math.floor(rnd()*59)+'m', price: base - 400 + Math.floor(rnd()*900), stops:'Non-stop'},
  ];
  const trains = [
    {id:'tr1', mode:'train', operator:'Rajdhani Express', bookingUrl:'https://www.irctc.co.in/nget/train-search', from:fromCity, to:'Guwahati Jn.'+(destKey!=='guwahati'?' + road transfer':''), duration: (20+Math.round(rnd()*10))+'h', price: 1400+Math.floor(rnd()*1200), stops:'3AC/2AC'},
    {id:'tr2', mode:'train', operator:'Northeast Express', bookingUrl:'https://www.irctc.co.in/nget/train-search', from:fromCity, to:'Kamakhya Jn.'+(destKey!=='guwahati'?' + road transfer':''), duration: (28+Math.round(rnd()*12))+'h', price: 900+Math.floor(rnd()*900), stops:'Sleeper/3AC'},
  ];
  const buses = fromCity==='Kolkata'||fromCity==='Guwahati' ? [
    {id:'bs1', mode:'bus', operator:'ASTC Volvo', from:fromCity, to: destKey==='guwahati'?'Guwahati':'Kohora/Shillong via Guwahati', duration: fromCity==='Guwahati' ? (3+Math.round(rnd()*2))+'h' : (16+Math.round(rnd()*4))+'h', price: fromCity==='Guwahati'? 250+Math.floor(rnd()*250) : 1100+Math.floor(rnd()*500), stops:'AC sleeper'},
  ] : [];
  return {flights, trains, buses};
}

function readStoredUser(){

function $(sel, root=document){ return root.querySelector(sel); }
function $all(sel, root=document){ return [...root.querySelectorAll(sel)]; }

function fmtINR(n){ return '\u20b9' + Math.round(n).toLocaleString('en-IN'); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function isAuthenticated(){ return !!STATE.auth.user; }
function getAccounts(){
  try { return JSON.parse(localStorage.getItem('ai-yatri-accounts') || '[]'); }
  catch(e){ return []; }
}
function setAccounts(accounts){ localStorage.setItem('ai-yatri-accounts', JSON.stringify(accounts)); }
function restoreValidSession(){
  const session = STATE.auth.user;
  const account = session && getAccounts().find(item=>item.id===session.id && item.email===session.email);
  if (!account){
    STATE.auth.user = null;
    localStorage.removeItem('ai-yatri-session');
  }
}
function hashPassword(password){
  let hash = 2166136261;
  for (let i=0; i<password.length; i++) hash = Math.imul(hash ^ password.charCodeAt(i), 16777619);
  return (hash >>> 0).toString(16);
}
function openAuthModal(mode='login'){
  STATE.authOpen = true;
  STATE.authMode = mode;
  if (typeof renderAuthModal === 'function') renderAuthModal();
}
function closeAuthModal(){
  STATE.authOpen = false;
  const modal = document.getElementById('authModal');
  if (modal) modal.remove();
}
function requireAuth(){
  if (isAuthenticated()) return true;
  openAuthModal(getAccounts().length ? 'login' : 'register');
  return false;
}
function registerAccount(name, email, password){
  const accounts = getAccounts();
  const normalizedEmail = email.toLowerCase();
  if (accounts.some(account=>account.email===normalizedEmail)) return 'An account with this email already exists. Please log in.';
  const user = {id: crypto.randomUUID ? crypto.randomUUID() : `user-${Date.now()}`, name, email:normalizedEmail, passwordHash:hashPassword(password), createdAt:new Date().toISOString()};
  accounts.push(user);
  setAccounts(accounts);
  STATE.auth.user = {id:user.id, name:user.name, email:user.email, createdAt:user.createdAt};
  localStorage.setItem('ai-yatri-session', JSON.stringify(STATE.auth.user));
  closeAuthModal();
  render();
}
function loginAccount(email, password){
  const account = getAccounts().find(item=>item.email===email.toLowerCase());
  if (!account || account.passwordHash!==hashPassword(password)) return 'Email or password is incorrect.';
  STATE.auth.user = {id:account.id, name:account.name, email:account.email, createdAt:account.createdAt};
  localStorage.setItem('ai-yatri-session', JSON.stringify(STATE.auth.user));
  closeAuthModal();
  render();
}
function logout(){
  localStorage.removeItem('ai-yatri-session');
  STATE.auth.user = null;
  STATE.screen = 'home';
  render();
}

        {id:`${key}-food`, name:`${cleanName} local food trail`, tags:['food'], desc:`Try local dishes and everyday markets in ${cleanName}.`, bestTime:'Evening', reason:'Markets and food streets are liveliest after sunset.', duration:'2 hrs', fee:'Pay as you go'},
        {id:`${key}-nature`, name:`${cleanName} nature escape`, tags:['nature','relaxation'], desc:`Take a slower break in a nearby park, lake, or scenic area.`, bestTime:'Late afternoon', reason:'Soft light and cooler air suit a relaxed visit.', duration:'2 hrs', fee:'Varies'},
        {id:`${key}-culture`, name:`${cleanName} culture experience`, tags:['culture','heritage'], desc:`Find a museum, craft space, or cultural performance nearby.`, bestTime:'Daytime', reason:'Indoor cultural stops work well around midday.', duration:'2 hrs', fee:'Varies'}
      ],
      stays: [{name:`${cleanName} budget stay`, type:'Budget hotel', rating:4, price:1800, distance:'Central area'}, {name:`${cleanName} city hotel`, type:'Mid-range hotel', rating:4.3, price:3000, distance:'Near main attractions'}],
      localMobility: {buses:[{route:'Local bus', path:`Central area ↔ ${cleanName} attractions`, fare:'Local fare'}], auto:'Use a metered auto or agree on the fare before the ride.', cab:'Use a trusted local cab or app where available.', bestBooking:'Reserve longer transfers ahead of busy travel periods.'},

      culture: {cuisine:['Local regional dishes','Street snacks','Tea or coffee specialties'], heritage:['Historic centre','Local museum or cultural space'], markets:['Main market','Craft and souvenir shops'], festivals:[{name:'Local festival calendar', when:'Check locally', note:'Dates vary by year.'}]}

/* ---------------- NAVIGATION ---------------- */
function goScreen(name, tab){
  if (!requireAuth()) return;
  STATE.screen = name;
  if (tab) STATE.tab = tab;
  render();
  const main = document.getElementById('main-scroll');
  if (main) main.scrollTop = 0;
}
function goTab(tab){ STATE.tab = tab; render(); }

/* ---------------- PERSONA / CHAT (AI + fallback) ---------------- */
const SCRIPTED_STEPS = [
  { field:'interests', prompt:"Namaste! I'm your AI Yatri planner. First \u2014 what draws you on a trip? Pick everything that fits.", multi:true, options: INTEREST_OPTIONS.map(o=>o.label) },
  { field:'pace', prompt:"Got it. Do you like a fast-paced trip that packs in a lot, or a relaxed one with room to breathe?", multi:false, options:['Fast-paced \u2014 pack it in','Relaxed \u2014 leave room to breathe'] },
  { field:'group', prompt:"Who's travelling with you?", multi:false, options:['Solo','Couple','Family','Friends'] },
  { field:'activity', prompt:"Last one \u2014 how comfortable are you with physical activity like hiking or long treks?", multi:false, options:['Low \u2014 prefer easy walking','Moderate \u2014 a few hours is fine','High \u2014 bring on the trek'] },
];

function personaComplete(){
  const p = STATE.persona;
  return p.interests.length>0 && p.pace && p.group && p.activity;
}

function initChatIfNeeded(){
  if (STATE.chat.length===0){
    STATE.chat.push({role:'assistant', text: SCRIPTED_STEPS[0].prompt, options: SCRIPTED_STEPS[0].options, multi:true, field:'interests'});
  }
}

function currentScriptedStep(){
  const p = STATE.persona;
  if (p.interests.length===0) return SCRIPTED_STEPS[0];
  if (!p.pace) return SCRIPTED_STEPS[1];
  if (!p.group) return SCRIPTED_STEPS[2];
  if (!p.activity) return SCRIPTED_STEPS[3];
  return null;
}

async function submitChatChoice(values){
  const step = currentScriptedStep();
  if (!step) return;
  // record the user's message
  STATE.chat.push({role:'user', text: values.join(', ')});
  applyPersonaField(step.field, values);

  const next = currentScriptedStep();
  if (next){
    STATE.chat.push({role:'assistant', text: next.prompt, options: next.options, multi: next.multi, field: next.field});
  } else {
    STATE.chatDone = true;
    STATE.chat.push({role:'assistant', text: buildPersonaSummaryLine() + " I've saved that to your traveller profile \u2014 head to Home to pick a destination, or tell me more any time and I'll refine it."});
  }
  render();
  await tryAIEnrich();
}

function applyPersonaField(field, values){
  const p = STATE.persona;
  if (field==='interests'){
    p.interests = values.map(v => (INTEREST_OPTIONS.find(o=>o.label===v)||{key:v.toLowerCase()}).key);
  } else if (field==='pace'){
    p.pace = values[0].startsWith('Fast') ? 'fast' : 'relaxed';
  } else if (field==='group'){
    p.group = values[0].toLowerCase();
  } else if (field==='activity'){
    p.activity = values[0].startsWith('Low') ? 'low' : values[0].startsWith('Moderate') ? 'moderate' : 'high';
  }
}

function buildPersonaSummaryLine(){
  const p = STATE.persona;
  const interestLabels = p.interests.map(k => (INTEREST_OPTIONS.find(o=>o.key===k)||{label:k}).label).join(', ');
  return `Nice \u2014 so you're after ${interestLabels.toLowerCase()}, at a ${p.pace} pace, travelling as ${p.group}, with ${p.activity} activity comfort.`;
}

// Free-text chat input -> try real Claude API; merge any persona fields it extracts; else nudge back to chips.
async function submitFreeText(text){
  STATE.chat.push({role:'user', text});
  render();
  const reply = await tryAIFreeText(text);
  if (reply){
    STATE.chat.push({role:'assistant', text: reply});
    const next = currentScriptedStep();
    if (next){
      STATE.chat.push({role:'assistant', text: next.prompt, options: next.options, multi: next.multi, field: next.field});
    }
  } else {
    const step = currentScriptedStep();
    if (step){
      STATE.chat.push({role:'assistant', text: "Thanks! Tap an option below so I capture that clearly in your profile.", options: step.options, multi: step.multi, field: step.field});
    } else {
      STATE.chat.push({role:'assistant', text: "Got it \u2014 noted. You can always adjust your traveller profile from the Profile tab."});
    }
  }
  render();
}

function localFreeTextReply(userText){
  const text = userText.toLowerCase();
  const found = [];
  const interestKeywords = {
    adventure: ['adventure','hike','hiking','trek','trekking','mountain','waterfall'],
    heritage: ['heritage','culture','history','temple','museum'],
    food: ['food','eat','cuisine','restaurant','street food'],
    wildlife: ['wildlife','rhino','safari','animals','birds','forest'],
    spiritual: ['spiritual','temple','pilgrim','pilgrimage'],
    nightlife: ['nightlife','party','bars','music'],
    relaxation: ['relax','relaxed','peaceful','quiet','slow']
  };
  Object.entries(interestKeywords).forEach(([key, words])=>{
    if (words.some(word=>text.includes(word)) && !found.includes(key)) found.push(key);
  });

  const p = STATE.persona;
  const step = currentScriptedStep();
  if (step && step.field==='interests' && found.length){
    p.interests = [...new Set([...p.interests, ...found])];
  }
  if (!p.pace && /(fast|packed|busy|many places)/.test(text)) p.pace = 'fast';
  if (!p.pace && /(relax|slow|easy|unhurried)/.test(text)) p.pace = 'relaxed';
  if (!p.group){
    if (/(solo|alone|myself)/.test(text)) p.group = 'solo';
    else if (/(couple|partner|spouse)/.test(text)) p.group = 'couple';
    else if (/(family|children|kids)/.test(text)) p.group = 'family';
    else if (/(friend|friends)/.test(text)) p.group = 'friends';
  }
  if (!p.activity){
    if (/(no hike|not active|easy walking|low activity)/.test(text)) p.activity = 'low';
    else if (/(trek|hike|very active|high activity)/.test(text)) p.activity = 'high';
    else if (/(moderate|few hours|some walking)/.test(text)) p.activity = 'moderate';
  }

  const destination = text.match(/\b(guwahati|shillong|kaziranga)\b/);
  if (destination){
    const dest = DESTINATIONS[destination[1]];
    return `${dest.name} is a good fit. ${dest.tagline}. I can shape the plan around ${p.interests.length ? p.interests.join(', ') : 'your travel style'}.`;
  }

  const vadodara = /\b(vadodara|vadodra|baroda)\b/.test(text);
  if (/(zoo|zoological|wildlife park|animal park)/.test(text) && vadodara){
    return 'Yes. In Vadodara, visit Sayaji Baug (Kamati Baug) Zoo, next to the museum and gardens. Go in the morning, then explore the park. Want a one-day Vadodara plan?';
  }
  if (/(zoo|zoological|wildlife park|animal park)/.test(text)){
    return 'A zoo is a nice easy-going wildlife stop. Tell me the city and I will suggest the best nearby zoo, opening-time strategy, and other places to combine with it.';
  }
  if (/(suggest|recommend|where should|place to visit|places to visit)/.test(text)){
    return 'I can recommend places, food, stays, or a complete itinerary. Tell me the city, dates, budget, and what you enjoy, and I will make specific suggestions.';
  }
  if (/(hello|hi|namaste|hey)\b/.test(text)) return 'Namaste! I can help with destinations, zoos, food, budgets, transport, and day-by-day plans. What would you like to explore?';
  if (found.length) return `That sounds like a ${found.join(' and ')} trip. I will use that preference when I build your itinerary.`;
  if (/(budget|cost|price|cheap|afford)/.test(text)) return 'I can keep the plan budget-conscious. Set your total budget on Home and I will prioritise transport and stays that fit it.';
  if (/(day|days|itinerary|plan|trip)/.test(text)) return 'Tell me your destination and number of days, and I will arrange a practical day-by-day plan.';
  return 'I can help with that. Tell me the place you want to visit and what you need there, such as attractions, food, transport, budget, or a complete plan.';
}

async function tryAIFreeText(userText){
  const fallbackReply = localFreeTextReply(userText);
  try {
    const messages = STATE.chat
      .filter(m=>m.role==='user' || m.role==='assistant')
      .map(m=>({role:m.role, content:m.text}));
    messages.push({role:'user', content:userText});
    const res = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({messages, persona:STATE.persona})
    });
    if (!res.ok) throw new Error('AI service unavailable');
    const data = await res.json();
    return data.reply || fallbackReply;
  } catch(e){
    return fallbackReply;
  }
}

async function tryAIEnrich(){ /* placeholder hook for future proactive enrichment */ }

/* ---------------- ITINERARY GENERATION ---------------- */
async function generateItinerary(){
  const dest = DESTINATIONS[STATE.trip.destKey];
  if (!dest) return;
  STATE.itineraryDays = null;
  render();
  let days = null;
  if (STATE.aiAvailable){
    days = await tryAIItinerary(dest);
  }
  if (!days){
    days = fallbackItinerary(dest);
    STATE.itineraryMode = 'fallback';
  } else {
    STATE.itineraryMode = 'ai';
  }
  STATE.itineraryDays = days;
  render();
}

function fallbackItinerary(dest){
  const p = STATE.persona;
  const interests = p.interests.length ? p.interests : ['heritage','nature','food'];
  const scored = dest.spots.map(s => ({...s, score: s.tags.filter(t=>interests.includes(t)).length}));
  scored.sort((a,b)=> b.score - a.score);
  const perDay = p.pace==='fast' ? 3 : 2;
  const totalDays = STATE.trip.days;
  const days = [];
  let idx = 0;
  for (let d=1; d<=totalDays; d++){
    const items = [];
    for (let i=0;i<perDay && idx<scored.length;i++){ items.push(scored[idx]); idx++; }
    if (items.length===0){ // wrap around if ran out
      for (let i=0;i<perDay;i++){ items.push(scored[i % scored.length]); }
    }
    days.push({ day:d, label: d===1 ? `Day 1 \u2014 Arrival & first taste of ${dest.name}` : (d===totalDays ? `Day ${d} \u2014 Last looks & departure` : `Day ${d} \u2014 Deeper into ${dest.name}`), items });
  }
  return days;
}

async function tryAIItinerary(dest){
  try {
    const system = `You are the itinerary engine inside "AI Yatri", an India domestic-travel app. You must build a day-by-day plan using ONLY places from the provided candidate list (do not invent new places). Traveller profile: ${JSON.stringify(STATE.persona)}. Trip: ${STATE.trip.days} days, starting from ${STATE.trip.fromCity}, budget \u20b9${STATE.trip.budget}, ${STATE.trip.travelers} traveller(s). Candidate places (JSON): ${JSON.stringify(dest.spots.map(s=>({id:s.id,name:s.name,tags:s.tags,desc:s.desc,bestTime:s.bestTime,reason:s.reason,duration:s.duration,fee:s.fee})))}. Prioritize places matching the traveller's interests; respect pace (fast-paced = more items/day, relaxed = fewer). Reply ONLY with strict JSON, no markdown fences: {"days":[{"day":1,"label":"short day title","items":["<place id>", "..."]}]}. Use each place id at most once across the whole trip. Include ${STATE.persona.pace==='fast'?'3':'2'} to ${STATE.persona.pace==='fast'?'4':'3'} items per day where possible.`;
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:1200, system, messages:[{role:'user', content:'Generate the itinerary now.'}] })
    });
    if (!res.ok) throw new Error('bad status');
    const data = await res.json();
    const textBlock = (data.content||[]).find(b=>b.type==='text');
    if (!textBlock) throw new Error('no text');
    const clean = textBlock.text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    if (!parsed.days || !Array.isArray(parsed.days)) throw new Error('bad shape');
    const byId = {}; dest.spots.forEach(s=>byId[s.id]=s);
    const days = parsed.days.map(d => ({
      day: d.day, label: d.label || `Day ${d.day}`,
      items: (d.items||[]).map(id=>byId[id]).filter(Boolean)
    })).filter(d=>d.items.length>0);
    if (days.length===0) throw new Error('empty');
    return days;
  } catch(e){
    return null;
  }
}

/* ---------------- BUDGET HELPERS ---------------- */
function transportCost(){
  if (!STATE.transportSelected) return 0;
  return STATE.transportSelected.price * STATE.trip.travelers;
}
function stayCost(nights){
  if (!STATE.staySelected) return 0;
  return STATE.staySelected.price * (nights||STATE.trip.days);
}
function remainingBudget(){
  return STATE.trip.budget - transportCost();
}

/* ---------------- OFFLINE PACK SIMULATION ---------------- */
function startOfflineDownload(){
  if (!STATE.trip.destKey) return;
  STATE.offline.downloadingKey = STATE.trip.destKey;
  STATE.offline.progress = 0;
  STATE.offline.downloaded = false;
  render();
  const timer = setInterval(()=>{
    STATE.offline.progress += 14 + Math.random()*10;
    if (STATE.offline.progress >= 100){
      STATE.offline.progress = 100;
      STATE.offline.downloaded = true;
      STATE.offline.downloadingKey = null;
      clearInterval(timer);
    }
    render();
  }, 260);
}

function render(){

function wireAuthButton(){

  button.textContent = isAuthenticated() ? 'Log out' : 'Sign in';

  button.dataset.wired = 'true';
  button.addEventListener('click', ()=> isAuthenticated() ? logout() : openAuthModal(getAccounts().length ? 'login' : 'register'));
}

function renderAuthModal(){
  const current = document.getElementById('authModal');
  if (current) current.remove();
  const registerMode = STATE.authMode==='register';
  const modal = el(`<div class="auth-backdrop" id="authModal">
    <form class="auth-card" id="authForm">
      <button type="button" class="auth-close" id="authClose" aria-label="Close">×</button>
      <span class="eyebrow">AI Yatri account</span>
      <h2>${registerMode ? 'Create your account' : 'Welcome back'}</h2>

      <div class="auth-error" id="authError" role="alert"></div>
      ${registerMode ? '<label class="auth-label">Full name<input id="authName" type="text" required minlength="2" placeholder="Your name" autocomplete="name"/></label>' : ''}
      <label class="auth-label">Email<input id="authEmail" type="email" required placeholder="you@example.com" autocomplete="email"/></label>
      <label class="auth-label">Password<input id="authPassword" type="password" required minlength="6" placeholder="At least 6 characters" autocomplete="${registerMode?'new-password':'current-password'}"/></label>
      ${registerMode ? '<label class="auth-label">Confirm password<input id="authConfirmPassword" type="password" required minlength="6" placeholder="Repeat your password" autocomplete="new-password"/></label>' : ''}
      <button class="cta-btn" type="submit">${registerMode ? 'Create account' : 'Log in'}</button>
      <button class="auth-switch" type="button" id="authSwitch">${registerMode ? 'Already have an account? Log in' : 'New here? Create an account'}</button>
      <p class="auth-note">Local demo authentication: account data stays in this browser.</p>
    </form>
  </div>`);
  document.body.appendChild(modal);
  $('#authClose', modal).addEventListener('click', closeAuthModal);
  $('#authForm', modal).addEventListener('submit', e=>{
    e.preventDefault();
    const email = $('#authEmail', modal).value.trim();
    const password = $('#authPassword', modal).value;
    const error = $('#authError', modal);
    if (STATE.authMode==='register'){
      const name = $('#authName', modal).value.trim();
      const confirmPassword = $('#authConfirmPassword', modal).value;
      if (password!==confirmPassword){ error.textContent='Passwords do not match.'; return; }
      const result = registerAccount(name, email, password);
      if (result) error.textContent = result;
    } else {
      const result = loginAccount(email, password);
      if (result) error.textContent = result;
    }
  });
  $('#authSwitch', modal).addEventListener('click', ()=>openAuthModal(registerMode ? 'login' : 'register'));
}

function realPhotoFor(item, index){
  const photos = {
    wildlife: 'https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?auto=format&fit=crop&w=900&q=82',
    nature: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=82',
    water: 'https://images.unsplash.com/photo-1473445361085-b9a07f55608b?auto=format&fit=crop&w=900&q=82',
    culture: 'https://images.unsplash.com/photo-1524492412937-b28074a5d7da?auto=format&fit=crop&w=900&q=82',
    food: 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=900&q=82',
    default: 'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=82'
  };
  const tags = item.tags || [];
  if (tags.includes('wildlife')) return photos.wildlife;
  if (tags.includes('food')) return photos.food;
  if (tags.includes('nature')) return tags.includes('relaxation') ? photos.water : photos.nature;
  if (tags.includes('culture') || tags.includes('heritage') || tags.includes('spiritual')) return photos.culture;
  return photos.default;
}

function visitImages(item, index){
  const photo = realPhotoFor(item, index);
  const dayImage = photo;
  const nightImage = item.nightImage || photo;
  return `<div class="visit-media"><figure><img src="${dayImage}" alt="Day view for ${escapeHtml(item.name)}"/><figcaption>Day view</figcaption></figure><figure><img src="${nightImage}" alt="Evening view for ${escapeHtml(item.name)}"/><figcaption>Evening / night plan</figcaption></figure></div>`;
}

  <img src="${IMG.map}" class="section-hero" alt=""/>
  <section class="block">
    <div class="block-head"><h2>Safety layer \u2014 ${dest.name}</h2></div>
    <div class="demo-banner">${s.sourceNote} <br/><span class="muted">${s.lastUpdated}</span></div>
    <div class="safety-map">
      ${renderSafetySVG(dest, s)}
    </div>
    <div class="zone-list">
      ${s.zones.map(z=>`<div class="zone-row"><span class="zone-dot" style="background:${levelDots[z.level]}"></span><div><strong>${z.area}</strong><p>${z.note}</p></div></div>`).join('')}
    </div>
    <div class="helpline-grid">
      ${s.helplines.map(h=>`<div class="helpline-chip"><span>${h.label}</span><strong>${h.num}</strong></div>`).join('')}
    </div>
  </section>

  <section class="block google-map-block">
    <div class="block-head"><h2>Google Maps</h2><a class="ghost-btn small" href="https://www.google.com/maps/search/?api=1&query=${mapQuery}" target="_blank" rel="noopener">Open full map ↗</a></div>
    <iframe class="google-map" title="Google Map for ${escapeHtml(dest.name)}" src="${mapSrc}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    <p class="muted">Use the map for live directions, traffic, place details, and current opening information.</p>
  </section>

  <section class="block">
    <div class="block-head"><h2>Offline emergency pack</h2></div>
    <p class="muted">Cache maps, key routes and emergency points before you lose signal. Live rerouting won\u2019t work offline \u2014 this stores pre-set routes and pins only.</p>
    ${offlineWidget(dest)}
  </section>`;
}

function renderSafetySVG(dest, s){
  const colors = {safer:'#1D8377', caution:'#E8A33D'};
  const pts = [[90,80],[220,120],[150,220],[280,60],[60,190]];
  const zoneCircles = s.zones.map((z,i)=>{
    const [x,y] = pts[i%pts.length];
    return `<circle cx="${x}" cy="${y}" r="34" fill="${colors[z.level]}" opacity="0.28"/><circle cx="${x}" cy="${y}" r="6" fill="${colors[z.level]}"/>`;
  }).join('');
  const pois = [[190,40,'\ud83c\udfe5'],[40,140,'\ud83d\udc6e'],[250,190,'\ud83c\udfe5'],[130,150,'\ud83d\udc6e']];
  const poiMarks = pois.map(([x,y,e])=>`<text x="${x}" y="${y}" font-size="18">${e}</text>`).join('');
  return `<svg viewBox="0 0 320 240" class="mini-map">
    <rect x="0" y="0" width="320" height="240" rx="14" fill="var(--sand-dark)"/>
    <path d="M0,180 Q80,140 160,175 T320,150" stroke="var(--teal-500)" stroke-width="10" fill="none" opacity="0.35"/>
    ${zoneCircles}${poiMarks}
  </svg>`;
}

function offlineWidget(dest){
  const off = STATE.offline;
  if (off.downloaded && off.downloadingKey===null){
    const pois = ['ATM \u2014 Kohora Main Rd','Police Post \u2014 Town Centre','Govt. Hospital','Bus/Jeep Pickup Point','24hr Pharmacy'];
    return `<div class="offline-ready">
      <div class="offline-status"><span class="dot-ok"></span> Offline pack ready for ${dest.name}</div>
      <ul class="offline-pois">${pois.map(p=>`<li>\ud83d\udccd ${p}</li>`).join('')}</ul>
      <button class="ghost-btn small" id="simOfflineBtn">${off.simulating? 'Exit offline preview' : 'Preview offline mode'}</button>
      ${off.simulating ? `<div class="offline-sim"><div class="offline-sim-map">${renderSafetySVG(dest,dest.safety)}</div><p class="muted">Signal lost \u2014 showing cached pins & last-known routes only. Live rerouting unavailable.</p></div>` : ''}
    </div>`;
  }
  if (off.downloadingKey===dest.key){
    return `<div class="offline-progress"><div class="bar"><div class="bar-fill" style="width:${off.progress}%"></div></div><p>Caching map tiles, routes & emergency points\u2026 ${Math.round(off.progress)}%</p></div>`;
  }
  return `<button class="cta-btn" id="dlOfflineBtn">Download offline pack for ${dest.name}</button>`;
}

function wireMap(){
  const back = $('[data-nav="home"]'); if(back) back.addEventListener('click', ()=>goScreen('home'));
  const dl = $('#dlOfflineBtn'); if(dl) dl.addEventListener('click', startOfflineDownload);
  const sim = $('#simOfflineBtn'); if(sim) sim.addEventListener('click', ()=>{ STATE.offline.simulating = !STATE.offline.simulating; render(); });
}

/* ================= CHAT ================= */
function chatHtml(){
  initChatIfNeeded();
  const bubbles = STATE.chat.map((m,i)=>{
    if (m.role==='assistant'){
      const isLast = i===STATE.chat.length-1;
      const opts = (m.options && isLast) ? `<div class="chip-row" data-multi="${!!m.multi}" data-field="${m.field||''}">
        ${m.options.map(o=>`<button class="chip-opt" data-val="${escapeHtml(o)}">${o}</button>`).join('')}
        ${m.multi ? `<button class="chip-opt chip-confirm" id="confirmMulti">Continue \u2192</button>` : ''}
      </div>` : '';
      return `<div class="bubble bubble-ai"><span class="bubble-avatar">\ud83e\udded</span><div><div class="bubble-text">${escapeHtml(m.text)}</div>${opts}</div></div>`;
    }
    return `<div class="bubble bubble-user"><div class="bubble-text">${escapeHtml(m.text)}</div></div>`;
  }).join('');

  const personaCard = (STATE.persona.interests.length || STATE.persona.pace) ? `
    <div class="persona-mini">
      ${STATE.persona.interests.map(k=>`<span class="chip-tag">${(INTEREST_OPTIONS.find(o=>o.key===k)||{label:k}).label}</span>`).join('')}
      ${STATE.persona.pace?`<span class="chip-tag chip-alt">${STATE.persona.pace} pace</span>`:''}
      ${STATE.persona.group?`<span class="chip-tag chip-alt">${STATE.persona.group}</span>`:''}
      ${STATE.persona.activity?`<span class="chip-tag chip-alt">${STATE.persona.activity} activity</span>`:''}
    </div>` : '';

  return `
  <img src="${IMG.chat}" class="section-hero" alt=""/>
  ${personaCard}
  <div class="chat-scroll" id="chatScroll">${bubbles}</div>
  <div class="chat-input-row">
    <input id="chatInput" type="text" placeholder="Or just type how you like to travel\u2026" autocomplete="off"/>
    <button id="micBtn" class="icon-btn" title="Voice input \u2014 coming soon">\ud83c\udfa4</button>
    <button id="sendBtn" class="icon-btn send">\u27a4</button>
  </div>`;
}

function wireChat(){
  let selectedMulti = new Set();
  $all('.chip-opt').forEach(b=>{
    if (b.id==='confirmMulti') return;
    b.addEventListener('click', async ()=>{
      const row = b.closest('.chip-row');
      const isMulti = row.dataset.multi==='true';
      if (isMulti){
        b.classList.toggle('chip-selected');
        if (b.classList.contains('chip-selected')) selectedMulti.add(b.dataset.val); else selectedMulti.delete(b.dataset.val);
      } else {
        await submitChatChoice([b.dataset.val]);
      }
    });
  });
  const confirm = $('#confirmMulti');
  if (confirm) confirm.addEventListener('click', async ()=>{
    if (selectedMulti.size===0){ toast('Pick at least one interest'); return; }
    await submitChatChoice([...selectedMulti]);
  });
  const send = $('#sendBtn');
  const input = $('#chatInput');
  const doSend = async ()=>{
    if (!requireAuth()) return;
    const v = input.value.trim();
    if (!v) return;
    input.value='';
    await submitFreeText(v);
    const cs = $('#chatScroll'); if (cs) cs.scrollTop = cs.scrollHeight;
  };
  if (send) send.addEventListener('click', doSend);
  if (input) input.addEventListener('keydown', e=>{ if(e.key==='Enter') doSend(); });
  const mic = $('#micBtn'); if (mic) mic.addEventListener('click', ()=>toast('Voice input is a stretch feature \u2014 planned for the next milestone.'));
  const cs = $('#chatScroll'); if (cs) cs.scrollTop = cs.scrollHeight;
}

/* ================= PROFILE ================= */
function profileHtml(){
  const p = STATE.persona;
  const dest = STATE.trip.destKey ? DESTINATIONS[STATE.trip.destKey] : null;
  const user = STATE.auth.user;
  return `
  <img src="${IMG.profile}" class="section-hero" alt=""/>
  <section class="block">
    <div class="block-head"><h2>Traveller profile</h2><div class="profile-actions"><button class="ghost-btn small" data-nav="chat">Edit in chat</button><button class="ghost-btn small" id="logoutBtn">Log out</button></div></div>
    ${personaComplete() ? `
      <div class="profile-tags">
        ${p.interests.map(k=>`<span class="chip-tag">${(INTEREST_OPTIONS.find(o=>o.key===k)||{label:k}).label}</span>`).join('')}
      </div>
      <div class="profile-facts">
        <div><span>Pace</span><strong>${p.pace}</strong></div>
        <div><span>Group</span><strong>${p.group}</strong></div>
        <div><span>Activity comfort</span><strong>${p.activity}</strong></div>
      </div>` : `<p class="muted">Not built yet \u2014 head to Chat to tell AI Yatri how you like to travel.</p>`}
  </section>

  <section class="block">
    <div class="block-head"><h2>Trip summary</h2></div>
    ${dest ? `
    <div class="profile-facts">
      <div><span>Destination</span><strong>${dest.name}, ${dest.state}</strong></div>
      <div><span>From</span><strong>${STATE.trip.fromCity}</strong></div>
      <div><span>Days</span><strong>${STATE.trip.days}</strong></div>
      <div><span>Travellers</span><strong>${STATE.trip.travelers}</strong></div>
      <div><span>Budget</span><strong>${fmtINR(STATE.trip.budget)}</strong></div>
      <div><span>Transport</span><strong>${STATE.transportSelected? STATE.transportSelected.operator+' \u2014 '+fmtINR(transportCost()) : 'Not chosen'}</strong></div>
      <div><span>Stay</span><strong>${STATE.staySelected? STATE.staySelected.name+' \u2014 '+fmtINR(stayCost())+' total' : 'Not chosen'}</strong></div>
    </div>` : `<p class="muted">No trip set up yet.</p>`}
  </section>

  <section class="block">
    <div class="block-head"><h2>Account</h2></div>
    <div class="account-stub">
      <div class="account-row"><span>\ud83d\udc64</span><div><strong>${escapeHtml(user ? user.name : 'Traveller')}</strong><small>Signed-in traveller</small></div></div>
      <div class="account-row"><span>\u2709</span><div><strong>${escapeHtml(user ? user.email : '')}</strong><small>Saved locally on this device</small></div></div>
      <div class="account-row"><span>\ud83c\udf10</span> Language: <select id="langSel"><option>English</option><option>\u0939\u093f\u0928\u094d\u0926\u0940 (Hindi)</option><option>\u0985\u09b8\u09ae\u09c0\u09af\u09bc\u09be (Assamese)</option></select></div>
    </div>
  </section>

  <p class="footnote">AI Yatri \u2014 Smart India Hackathon prototype. Destinations researched manually for this demo (Guwahati, Shillong, Kaziranga). Transport & stay prices are sample data. Safety layer is illustrative and not sourced from a live NCRB/police feed.</p>`;
}

function wireProfile(){
  const nav = $('[data-nav="chat"]'); if(nav) nav.addEventListener('click', ()=>goScreen('chat'));
  const logoutButton = $('#logoutBtn'); if(logoutButton) logoutButton.addEventListener('click', logout);
}

/* ================= SHARED ================= */
function emptyState(title, body, cta, target){
  return `<div class="empty-state">
    <h2>${title}</h2><p>${body}</p>
    <button class="cta-btn" data-nav="${target}">${cta}</button>
  </div>`;
}

function wireScreen(screen){
  $all('[data-nav]').forEach(b=>{
    if (b.dataset.wired) return;
  });
  $all('[data-nav]').forEach(b=> b.addEventListener('click', ()=> goScreen(b.dataset.nav)));
  if (screen==='home') wireHome();
  if (screen==='itinerary') wireItinerary();
  if (screen==='map') wireMap();
  if (screen==='chat') wireChat();
  if (screen==='profile') wireProfile();
}

let toastTimer=null;
function toast(msg){
  let t = document.getElementById('toast');
  if (!t){ t = el(`<div id="toast" class="toast"></div>`); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

</script>
<script>
$all('.navitem').forEach(b => b.addEventListener('click', ()=> goScreen(b.dataset.screen)));

function showIntro(){
  const backdrop = el(`<div class="intro-backdrop" id="introBackdrop">
    <div class="intro-card">
      <div class="logo-mark">🧭</div>
      <h2>Welcome to AI Yatri</h2>
      <p>Chat once about how you like to travel — then get a personalised day-by-day plan, transport picks, stays, safety info and an offline emergency pack for your India trip.</p>
      <button class="cta-btn" id="introStart">Start planning</button>
    </div>
  </div>`);
  document.body.appendChild(backdrop);
  $('#introStart', backdrop).addEventListener('click', ()=>{ backdrop.remove(); goScreen('chat'); });
}

restoreValidSession();
render();
</script>
